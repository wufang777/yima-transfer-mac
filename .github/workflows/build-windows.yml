name: build-windows

on:
  workflow_dispatch:            # 允许手动触发（gh workflow run build-windows）
  push:
    tags: ["v*"]                # 推送 v 开头的 tag 自动构建

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pystray Pillow segno
          echo "== 安装 Qt 原生界面所需依赖 =="
          pip install PySide6-Essentials

      - name: 生成 ICO 图标
        run: |
          python -c "from PIL import Image; img = Image.open('assets/icon.png'); img.save('win/icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: PyInstaller 打包（服务端）
        run: pyinstaller win/yima_win.spec

      - name: PyInstaller 打包（原生界面）
        run: pyinstaller win/yima_qt_win.spec

      - name: 冒烟测试（headless 起服务并验证 API）
        run: |
          $p = Start-Process -FilePath "dist/yima-transfer.exe" -ArgumentList "--headless","--port","8099","--no-open" -PassThru
          Start-Sleep -Seconds 10
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:8099/api/version" -UseBasicParsing
          Write-Output $r.Content
          if ($r.Content -notmatch 'windows') { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; exit 1 }
          $f = Invoke-WebRequest -Uri "http://127.0.0.1:8099/files" -UseBasicParsing
          Write-Output $f.Content
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: 冒烟测试（原生界面离屏渲染，失败不阻断打包）
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
        run: |
          & "dist/yima-transfer-ui.exe" --smoke-all "ui-smoke"
          if (Test-Path "ui-smoke") { Get-ChildItem "ui-smoke" | Select-Object Name, Length }
          elseif (Test-Path "dist/ui-crash.log") { Write-Output "=== UI 崩溃日志 ==="; Get-Content "dist/ui-crash.log" -Tail 60 }
          else { Write-Output "UI smoke 未产出截图，也没有崩溃日志（非阻断）" }

      - name: 打包 zip（双 exe + 防火墙放行脚本）
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrEmpty($tag) -or "${{ github.ref_name }}".StartsWith("refs")) { $tag = "dev" }
          Compress-Archive -Path "dist/yima-transfer.exe","dist/yima-transfer-ui.exe","win/防火墙放行.bat" -DestinationPath "dist/yima-transfer-win64-$tag.zip" -Force
          Get-ChildItem dist/*.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: yima-transfer-win64
          path: dist/*.zip
          retention-days: 30
